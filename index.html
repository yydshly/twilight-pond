<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>暮色池塘 · Twilight Pond</title>
  </head>
  <body>
    <div id="app">
      <canvas id="pond-canvas"></canvas>
      <div id="whisper-overlay" class="whisper-overlay" aria-live="polite">
        <span class="whisper-title">暮色池塘</span>
        <span class="whisper-sub">拖拽可 360° 环看池塘 · 轻点水面泛起涟漪 · 按 H 沉浸全隐</span>
      </div>
      <div id="timer-badge" class="timer-badge hidden" aria-live="off"></div>
      <div id="mixer-popover" class="mixer-popover hidden" role="dialog" aria-label="独立音景混音"></div>
      <div id="controls-bar" class="controls-bar" role="region" aria-label="池塘环境控制"></div>
      <div id="ledger-modal" class="ledger-modal hidden" role="dialog" aria-modal="true" aria-labelledby="ledger-title"></div>
      <div id="debug-hud" class="debug-hud hidden" aria-hidden="true"></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
